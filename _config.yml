title: "micro:bit MicroPython Samples"
description: >-
  Kommentierte MicroPython-Beispiele fuer den BBC micro:bit V2.2 -
  Impulswoche an der Neuen Kantonsschule Aarau.
url: "https://masta-nksa.github.io"
baseurl: "/microbit-micropython-samples"

theme: minima
minima:
  skin: auto

header_pages:
  - code-samples/README.md
  - hardware/README.md
  - docs/setup.md
  - docs/workflow.md
  - docs/theorie.md

# Dropdown "Tools" im Header (siehe _includes/header.html)
tools_menu:
  - label: Loeten
    path: hardware/loeten.md
  - label: LightBurn (Laser-Dateien)
    path: hardware/lightburn.md
  - label: Fusion 360 (3D modellieren)
    path: hardware/fusion-360.md

markdown: kramdown
kramdown:
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-default-layout
  - jekyll-seo-tag
  - jekyll-sitemap

jekyll-titles-from-headings:
  enabled: true

relative_links:
  enabled: true
  collections: false

readme_index:
  with_frontmatter: true

exclude:
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - "*.hex"
