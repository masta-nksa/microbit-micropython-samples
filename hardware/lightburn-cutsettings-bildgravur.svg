<svg viewBox="0 0 340 380" width="340" height="380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="339" height="379" rx="6" fill="#ffffff" stroke="#333333"/>
  <rect x="0.5" y="0.5" width="339" height="34" rx="6" fill="#6a4a78"/>
  <rect x="0.5" y="24" width="339" height="10.5" fill="#6a4a78"/>
  <text x="14" y="23" fill="#ffffff" font-size="13" font-weight="bold">Cuts/Layers - C0x Bildgravur (Image)</text>
  <text x="14" y="50" fill="#2f6f3f" font-size="11" font-weight="bold">✓ ausprobiert, funktioniert</text>

  <g font-size="12" fill="#222222">
    <text x="14" y="78">Mode</text>
    <rect x="150" y="64" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="78" font-weight="bold">Image</text>

    <text x="14" y="106">Speed</text>
    <rect x="150" y="92" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="106" font-weight="bold">300 mm/s</text>

    <text x="14" y="134">Max Power</text>
    <rect x="150" y="120" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="134" font-weight="bold">12.5 %</text>

    <text x="14" y="162">Min Power</text>
    <rect x="150" y="148" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="162" font-weight="bold">10.00 %</text>

    <text x="14" y="190">Line Interval</text>
    <rect x="150" y="176" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="190" font-weight="bold" font-size="11">0.1200 mm / 212 DPI</text>

    <text x="14" y="218">Passes</text>
    <rect x="150" y="204" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="218" font-weight="bold">1</text>

    <text x="14" y="252" font-weight="bold">Bild anpassen</text>

    <text x="14" y="280">Kontrast</text>
    <rect x="150" y="266" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="280" font-weight="bold">+10 %</text>

    <text x="14" y="308">Dither-Modus</text>
    <rect x="150" y="294" width="176" height="20" fill="#f3eef6" stroke="#9a8aa7"/>
    <text x="158" y="308" font-weight="bold">Stucki / Jarvis</text>
  </g>

  <text x="14" y="340" fill="#777777" font-size="10.5" font-style="italic">Schematische Darstellung der wichtigsten Felder -</text>
  <text x="14" y="354" fill="#777777" font-size="10.5" font-style="italic">kein echter Screenshot von LightBurn.</text>
