<svg viewBox="0 0 340 296" width="340" height="296" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="339" height="295" rx="6" fill="#ffffff" stroke="#333333"/>
  <rect x="0.5" y="0.5" width="339" height="34" rx="6" fill="#3a5a78"/>
  <rect x="0.5" y="24" width="339" height="10.5" fill="#3a5a78"/>
  <text x="14" y="23" fill="#ffffff" font-size="13" font-weight="bold">Cuts/Layers - C00 Schneiden (Cut)</text>

  <g font-size="12" fill="#222222">
    <text x="14" y="60">Mode</text>
    <rect x="150" y="46" width="176" height="20" fill="#eef2f6" stroke="#9aa7b0"/>
    <text x="158" y="60" font-weight="bold">Line</text>

    <text x="14" y="88">Speed</text>
    <rect x="150" y="74" width="176" height="20" fill="#eef2f6" stroke="#9aa7b0"/>
    <text x="158" y="88" font-weight="bold">16.0 mm/s</text>

    <text x="14" y="116">Max Power</text>
    <rect x="150" y="102" width="176" height="20" fill="#eef2f6" stroke="#9aa7b0"/>
    <text x="158" y="116" font-weight="bold">55.0 %</text>

    <text x="14" y="144">Min Power</text>
    <rect x="150" y="130" width="176" height="20" fill="#eef2f6" stroke="#9aa7b0"/>
    <text x="158" y="144" font-weight="bold">45.0 %</text>

    <text x="14" y="172">Passes</text>
    <rect x="150" y="158" width="176" height="20" fill="#eef2f6" stroke="#9aa7b0"/>
    <text x="158" y="172" font-weight="bold">1</text>

    <text x="14" y="200">Z Offset</text>
    <rect x="150" y="186" width="176" height="20" fill="#eef2f6" stroke="#9aa7b0"/>
    <text x="158" y="200" font-weight="bold">+2.00 mm</text>

    <text x="14" y="228">Schnittversatz</text>
    <rect x="150" y="214" width="176" height="20" fill="#eef2f6" stroke="#9aa7b0"/>
    <text x="158" y="228" font-weight="bold">0.00 mm</text>
  </g>

  <text x="14" y="258" fill="#777777" font-size="10.5" font-style="italic">Schematische Darstellung der wichtigsten Felder -</text>
  <text x="14" y="272" fill="#777777" font-size="10.5" font-style="italic">kein echter Screenshot von LightBurn.</text>
</svg>
